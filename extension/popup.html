<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaceGuard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>FaceGuard</h1>
    <p class="tagline">Google Alerts for your face</p>
  </header>

  <main>
    <p id="status" class="status info">Loading...</p>

    <button id="scanBtn" type="button">Scan now</button>

    <section>
      <h2>Alerts</h2>
      <ul id="alertList">
        <li class="empty">No alerts to show yet.</li>
      </ul>
    </section>

    <section class="upload">
      <h2>Reference photo</h2>
      <p class="hint">Upload a clear, front-facing photo of yourself (JPG or PNG, up to 5 MB). It stays in a private bucket and is only used for matching.</p>
      <input id="refFile" type="file" accept="image/jpeg,image/png" />
      <button id="uploadBtn" type="button" class="secondary">Upload reference photo</button>
      <p id="uploadMsg" class="upload-msg"></p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
